<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoteLib - Создать заметку</title>
  <link rel="stylesheet" href="style/notes.css">
</head>
<body>
  <div class="page">
    <header class="header">
            <div class="brand">
                <a href="/" class="home-link"><h1>NoteLib</h1></a>
                <p>ваш лучший помощник</p>
            </div>
            <div class="auth" role="group" aria-label="Авторизация — скоро появится">
                <button class="auth-button" type="button" disabled title="Вход будет доступен позже">Войти</button>
                <button class="auth-button auth-button-primary" type="button" disabled title="Регистрация будет доступна позже">Регистрация</button>
            </div>
        </header>
    <main class="content workspace">
<div class="section-heading"><a class="back-link" href="/">← На главную</a><h2>Создать заметку</h2><p>Запишите важное и выберите удобное время для напоминания.</p></div>

    <form class="note-form" id="noteForm">
      <input
        type="text"
        class="note-input"
        id="noteInput"
        placeholder="О чём напомнить…"
        aria-label="Название заметки"
        autocomplete="off"
        required
      />
      <button type="submit" class="add-btn">Добавить</button>
    </form>
    
    <!-- Модальное окно для создания заметки -->
    <div id="noteModal" class="modal" style="display: none;">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Создать напоминание</h2>
          <button type="button" class="close" aria-label="Закрыть">&times;</button>
        </div>
        <div class="modal-body">
          <p><strong>Название:</strong> <span id="modalNoteTitle"></span></p>
          
          <div class="form-group">
            <label for="reminderDate">Дата напоминания:</label>
            <input type="date" id="reminderDate" class="form-control">
          </div>
          
          <div class="form-group">
            <label for="reminderTime">Время напоминания:</label>
            <input type="time" id="reminderTime" class="form-control">
          </div>
          
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="emailReminder">
              <span class="checkmark"></span>
              Напомнить на почту
            </label>
          </div>
          
          <div class="form-group" id="emailField" style="display: none;">
            <label for="email">Email:</label>
            <input type="email" id="email" class="form-control" placeholder="Введите email">
          </div>
          
          <div class="modal-footer">
            <button id="createNoteBtn" class="btn btn-primary">Создать</button>
            <button id="cancelBtn" class="btn btn-secondary">Отмена</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="notes-section">
      <h2>Мои заметки</h2>
      <div class="notes-grid" id="notesList">
        <!-- Здесь будут отображаться заметки -->
      </div>
    </div>
    </main>
  </div>
<footer class="footer">
        <div class="autor"><h3>Злобин В.Е.</h3></div>
    </footer>
<script src="/app.js"></script>
</body>
</html>

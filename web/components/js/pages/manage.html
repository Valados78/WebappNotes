<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заметками</title>
    <link rel="stylesheet" href="style/manage.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="brand">
                <a href="/" class="home-link"><h1>NoteLib</h1></a>
                <p>ваш лучший помощник</p>
            </div>
            <div class="auth" role="group" aria-label="Авторизация — скоро появится">
                <button class="auth-button" type="button" disabled title="Вход будет доступен позже">Войти</button>
                <button class="auth-button auth-button-primary" type="button" disabled title="Регистрация будет доступна позже">Регистрация</button>
            </div>
        </header>
        <main class="content workspace">
            <div class="manage-section">
                <div class="section-heading"><a class="back-link" href="/">← На главную</a><h2>Управление заметками</h2><p>Просматривайте заметки и удаляйте те, которые больше не нужны.</p></div>
                <div class="notes-grid" id="manageNotesList">
                    <!-- Здесь будут отображаться заметки с кнопками удаления -->
                </div>
            </div>
        </main>
        <div class="footer">
            <div class="autor">
                <h3>Злобин В.Е.</h3>
            </div>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
